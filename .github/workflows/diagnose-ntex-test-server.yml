name: Diagnose ntex test server flake

on:
  push:
    branches:
      - codex/diagnose-io-uring-flake
  workflow_dispatch:
    inputs:
      ntex_iterations:
        description: ntex-only parallel test-server iterations
        required: false
        default: "1000"
      serial_iterations:
        description: ntex-only serial diagnostic control iterations
        required: false
        default: "200"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: full
  RUST_LOG_FILTER: ntex_net::uring=trace,ntex_io=trace,ntex_server=trace,ntex::client=trace,ntex::http=trace

jobs:
  stress:
    name: ubuntu-24.04 / rust 1.88 ntex-only stress
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NTEX_ITERS: ${{ github.event.inputs.ntex_iterations || '1000' }}
      SERIAL_ITERS: ${{ github.event.inputs.serial_iterations || '200' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      - name: Environment
        run: |
          set -euo pipefail
          rustc --version --verbose
          cargo --version --verbose
          uname -a
          cat /proc/version
          printf 'nproc: '; nproc
          ulimit -a
          printf 'io_uring_disabled: '
          cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || true
          printf 'io_uring_group: '
          cat /proc/sys/kernel/io_uring_group 2>/dev/null || true

      - name: Build ntex-only diagnostic test once
        run: cargo test --all-features --test ntex_test_server_parallel --no-run --verbose

      - name: Stress ntex-only diagnostic test, default parallel harness
        id: ntex_parallel
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ntex-diagnostic-logs
          for i in $(seq 1 "$NTEX_ITERS"); do
            log="ntex-diagnostic-logs/ntex-parallel-${i}.log"
            echo "::group::ntex parallel iteration ${i}/${NTEX_ITERS}"
            set +e
            timeout 120s env RUST_LOG="$RUST_LOG_FILTER" \
              cargo test --all-features --test ntex_test_server_parallel -- --nocapture \
              >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              {
                echo "name=ntex-parallel"
                echo "iteration=${i}"
                echo "status=${status}"
                echo "command=cargo test --all-features --test ntex_test_server_parallel -- --nocapture"
                echo "rustc=$(rustc --version)"
                echo "kernel=$(uname -a)"
              } > ntex-diagnostic-logs/failure-ntex-parallel.env
              echo "::error::ntex parallel failed on iteration ${i} with status ${status}"
              tail -n 500 "$log"
              echo "::endgroup::"
              exit "$status"
            fi
            rm -f "$log"
            echo "::endgroup::"
          done

      - name: Stress ntex-only diagnostic test, serial harness control
        id: ntex_serial
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ntex-diagnostic-logs
          for i in $(seq 1 "$SERIAL_ITERS"); do
            log="ntex-diagnostic-logs/ntex-serial-${i}.log"
            echo "::group::ntex serial iteration ${i}/${SERIAL_ITERS}"
            set +e
            timeout 120s env RUST_LOG="$RUST_LOG_FILTER" \
              cargo test --all-features --test ntex_test_server_parallel -- --nocapture --test-threads=1 \
              >"$log" 2>&1
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              {
                echo "name=ntex-serial"
                echo "iteration=${i}"
                echo "status=${status}"
                echo "command=cargo test --all-features --test ntex_test_server_parallel -- --nocapture --test-threads=1"
                echo "rustc=$(rustc --version)"
                echo "kernel=$(uname -a)"
              } > ntex-diagnostic-logs/failure-ntex-serial.env
              echo "::error::ntex serial failed on iteration ${i} with status ${status}"
              tail -n 500 "$log"
              echo "::endgroup::"
              exit "$status"
            fi
            rm -f "$log"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ntex-test-server-diagnostic-logs
          path: ntex-diagnostic-logs/
          if-no-files-found: ignore

      - name: Report diagnostic outcome
        if: always()
        run: |
          set -euo pipefail
          printf 'ntex parallel outcome: %s\n' '${{ steps.ntex_parallel.outcome }}'
          printf 'ntex serial outcome: %s\n' '${{ steps.ntex_serial.outcome }}'
          test '${{ steps.ntex_parallel.outcome }}' = success
          test '${{ steps.ntex_serial.outcome }}' = success
