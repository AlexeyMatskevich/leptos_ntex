[package]
name = "leptos-ntex-unofficial"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial Leptos SSR integration for the ntex web framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AlexeyMatskevich/leptos_ntex"
documentation = "https://docs.rs/leptos-ntex-unofficial"
readme = "README.md"
keywords = ["leptos", "ntex", "ssr", "web", "integration"]
categories = ["web-programming", "web-programming::http-server"]
authors = ["Aleksey Matskevich"]
exclude = ["ACTIX_TO_NTEX_NOTES.md", "scripts/", "flake.nix", "flake.lock", ".zed/", ".venv/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
any_spawner = "0.3.0"
bytes = "1.11.1"
futures = "0.3.31"
hydration_context = "0.3.0"
leptos = { version = "0.8.19", features = ["ssr", "nonce"] }
# NOTE: `NtexResponse::from_app` (src/response.rs) is a frozen near-verbatim
# copy of this version's `ExtendResponse::from_app`, diverging only to clean up
# the reactive Owner on `Drop` (owner-leak stopgap, leptos-rs/leptos#4739).
# When bumping this dependency, re-diff that override against the new source and
# delete it once upstream ships the `Drop`-based cleanup.
leptos_integration_utils = "0.8.8"
leptos_meta = { version = "0.8.6", features = ["ssr", "nonce"] }
leptos_router = { version = "0.8.13", features = ["ssr"] }
lru = "0.18"
mime = "0.3"
ntex = "3.9.6"
ntex-files = "3.2.0"
percent-encoding = "2.3"
or_poisoned = "0.1.0"
send_wrapper = { version = "0.6.0", features = ["futures"] }
server_fn = { version = "0.8.12", features = ["ssr"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
ciborium = "0.2.2"
lets_expect = "0.5.2"
serde_json = "1.0.145"
server_fn = { version = "0.8.12", features = ["cbor"] }

[[example]]
name = "auth_extractor"
path = "examples/auth_extractor.rs"
required-features = ["cookie"]

[features]
default = []
cookie = ["ntex/cookie"]
tracing = ["dep:tracing"]
islands-router = ["leptos/islands-router"]
